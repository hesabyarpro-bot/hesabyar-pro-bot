services:
  - type: web
    name: hesabyar-pro-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_TELEGRAM_ID
        value: "8806709666"

      - key: CARD_NUMBER
        sync: false

      - key: CARD_HOLDER
        sync: false

      - key: PORT
        value: "10000"
